name: ddrec-license-staging

services:
  postgres:
    image: postgres:17.5-alpine
    env_file:
      - ./env/postgres.env
    volumes:
      - ddrec_license_staging_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &json-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  license-api:
    build:
      context: ../../license-server
    env_file:
      - ./env/app.env
    volumes:
      - ./secrets/dev_ed25519_private.pem:/run/secrets/license_signing_private_key.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=4).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *json-logging

  caddy:
    build:
      context: ../../license-admin
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_BASE_PATH: /admin/
        VITE_APP_ENVIRONMENT: staging
    ports:
      - "${STAGING_HTTP_PORT:-18088}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ddrec_license_staging_caddy_data:/data
      - ddrec_license_staging_caddy_config:/config
      - ddrec_license_staging_caddy_logs:/var/log/caddy
    networks:
      - edge
      - backend
    depends_on:
      license-api:
        condition: service_healthy
    restart: unless-stopped
    logging: *json-logging

volumes:
  ddrec_license_staging_postgres_data:
  ddrec_license_staging_caddy_data:
  ddrec_license_staging_caddy_config:
  ddrec_license_staging_caddy_logs:

networks:
  edge:
  backend:
    internal: true
