[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ddrec-license-server"
version = "1.3.0"
description = "DDREC authorization backend foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "cffi>=2,<3",
  "cryptography>=48.0.1,<49",
  "fastapi>=0.116,<1",
  "packaging>=25,<26",
  "pyotp>=2.9,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
ddrec-license-create = "app.cli.create_license:main"
ddrec-license-cleanup-expired = "app.cli.cleanup_expired:main"
ddrec-license-import-update-draft = "app.cli.import_client_release_draft:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the dedicated PostgreSQL test database",
]
