name: license-server

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ddrec_license
      POSTGRES_PASSWORD: ddrec_license_dev_only
      POSTGRES_DB: ddrec_license_dev
    ports:
      - "5433:5432"
      - "5434:5432"
    volumes:
      - license_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddrec_license -d ddrec_license_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  license-api:
    build: .
    env_file: .env
    ports:
      - "${LICENSE_API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.secrets/dev_ed25519_private.pem:/run/secrets/license_signing_private_key.pem:ro
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  license_postgres_data:
